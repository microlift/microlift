[package]
name = "microlift"
version = "0.1.0"
edition = "2024"

[features]
disasm = ["dep:capstone"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
cranelift = "0.133"
cranelift-frontend = "0.133"
cranelift-module = "0.133"
cranelift-jit = "0.133"
cranelift-native = "0.133"
cranelift-object = "0.133"
object = "0.36"
capstone = { version = "0.13", optional = true }
iced-x86 = "1"
target-lexicon = "0.13"
thiserror = "1"
cranelift-codegen = { version = "0.133", features = ["all-arch"] }
yaxpeax-arm = "0.4.0"
yaxpeax-arch = "0.3.2"
function_traits = { git = "https://github.com/microlift/function_traits.git", version = "0.1.0" }
