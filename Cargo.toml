[package]
name = "microlift"
version = "0.1.0"
edition = "2024"

[features]
disasm = ["dep:capstone"]

[dependencies]
cranelift = "0.131"
cranelift-frontend = "0.131"
cranelift-module = "0.131"
cranelift-jit = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
object = "0.36"
capstone = { version = "0.13", optional = true }
iced-x86 = "1"
target-lexicon = "0.13"
thiserror = "1"
cranelift-codegen = { version = "0.131", features = ["all-arch"] }
