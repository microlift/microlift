[package]
name = "microlift"
version = "0.1.0"
edition = "2024"

[features]
disasm = ["dep:capstone"]
serde = ["dep:serde"]
testkit = []
fuzzing = ["testkit", "dep:proptest"]
unicorn-oracle = ["testkit", "dep:unicorn-engine"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
cranelift = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-frontend = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-module = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-jit = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-native = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-object = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
object = "0.36"
capstone = { version = "0.13", optional = true }
iced-x86 = "1"
target-lexicon = "0.13"
thiserror = "1"
cranelift-codegen = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev", features = ["all-arch"] }
yaxpeax-arm = "0.4.0"
yaxpeax-arch = "0.3.2"
function_traits = { git = "https://github.com/microlift/function_traits.git", version = "0.1.0" }
# Optional, test-only. Pulled in only by the `fuzzing` / `unicorn-oracle`
# features; the default build graph is unaffected.
proptest = { version = "1", optional = true }
unicorn-engine = { version = "2", optional = true }

[dev-dependencies]
rustc_apfloat = "0.2"

